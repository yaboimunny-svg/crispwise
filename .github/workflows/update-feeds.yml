name: Update food recalls and news
# Fetches the official Government of Canada feeds every 3 hours so the app can show them
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download feeds
        run: |
          curl -fsSL -A "Mozilla/5.0 (Crispwise feed bot)" "https://recalls-rappels.canada.ca/en/feed/cfia-alerts-recalls" -o feeds-recalls.xml
          curl -fsSL -A "Mozilla/5.0 (Crispwise feed bot)" "https://api.io.canada.ca/io-server/gc/news/en/v2?dept=foodinspectionagency&sort=publishedDate&orderBy=desc&pick=8&format=json" -o feeds-cfia-news.json || true
          grep -q "<item>" feeds-recalls.xml
      - name: Save if changed
        run: |
          git config user.name "crispwise-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds-recalls.xml feeds-cfia-news.json
          git diff --cached --quiet || (git commit -m "Update food recalls and news" && git push)
